plugins {
    id 'multiloader-loader'
    id 'net.neoforged.gradle.userdev' version '7.0.145'

}
// 1.20.1 NeoForge is net.neoforged:forge:1.20.1-47.1.x, not net.neoforged:neoforge.
// ModDevGradle enable { neoForgeVersion } is bug https://github.com/neoforged/ModDevGradle/issues/239
// Do not add the Mixin annotation processor here. It requires an SRG refmap and rejects Mojmap names like tick.
dependencies {
    implementation "net.neoforged:forge:${minecraft_version}-${neoforge_version}"
    compileOnly project(":common")
}

runs {
    client {
        client()
    }
    server {
        server()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

jar.finalizedBy('reobfJar')